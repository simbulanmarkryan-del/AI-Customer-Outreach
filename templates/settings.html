{% extends "layout.html" %}

{% block title %}Settings{% endblock %}

{% block page_title %}System Settings{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header">
        <h4>⚙️ Application Settings</h4>
    </div>

    <div class="card-body">

        <form>

            <div class="mb-3">
                <label class="form-label">Company Name</label>
                <input type="text" class="form-control" value="CustomerPulse AI">
            </div>

            <div class="mb-3">
                <label class="form-label">Administrator Email</label>
                <input type="email" class="form-control" value="admin@example.com">
            </div>

            <div class="mb-3">
                <label class="form-label">Default Outreach Channel</label>

                <select class="form-select">
                    <option>Email</option>
                    <option>SMS</option>
                </select>

            </div>

            <button class="btn btn-primary">
                Save Settings
            </button>

        </form>

    </div>

</div>

{% endblock %}
